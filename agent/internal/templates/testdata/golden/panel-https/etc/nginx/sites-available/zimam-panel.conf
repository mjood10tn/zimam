# Managed by Zimam. Changes here are overwritten.
server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/zimam-acme;
        default_type text/plain;
        allow all;
        auth_basic off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.example.com;

    ssl_certificate     /etc/letsencrypt/live/zimam-panel/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zimam-panel/privkey.pem;
    include /etc/nginx/zimam/tls.conf;

    # HSTS for this host only, so the owner's other subdomains aren't bound
    # by it, and §9.6's header preset. No location sets headers of its own,
    # so every response gets these.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /home/zimam/panel/current/public;
    index index.php index.html;
    autoindex off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/zimam-acme;
        default_type text/plain;
        allow all;
        auth_basic off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/zimam-panel.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }
}
