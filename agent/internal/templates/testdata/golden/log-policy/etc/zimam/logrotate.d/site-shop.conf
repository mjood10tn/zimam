# Managed by Zimam. Changes here are overwritten.
/var/log/zimam/sites/shop/*.log {
    daily
    maxsize 200M
    rotate 1000
    maxage 14
    missingok
    notifempty
    compress
    dateext
    dateformat -%Y%m%d-%s
    sharedscripts
    postrotate
        /usr/sbin/nginx -s reopen >/dev/null 2>&1 || true
    endscript
}

/home/s_shop/logs/*.log {
    su s_shop s_shop
    daily
    maxsize 200M
    rotate 1000
    maxage 14
    missingok
    notifempty
    compress
    dateext
    dateformat -%Y%m%d-%s
}
