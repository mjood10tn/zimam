# Managed by Zimam. Changes here are overwritten.
# The audit log keeps its own retention, set in Settings.
/var/log/zimam/audit.log {
    daily
    maxsize 200M
    rotate 1000
    maxage 365
    missingok
    notifempty
    compress
    dateext
    dateformat -%Y%m%d-%s
}

/home/zimam/panel/shared/storage/logs/*.log {
    su zimam zimam
    daily
    maxsize 200M
    rotate 1000
    maxage 14
    missingok
    notifempty
    compress
    dateext
    dateformat -%Y%m%d-%s
}
