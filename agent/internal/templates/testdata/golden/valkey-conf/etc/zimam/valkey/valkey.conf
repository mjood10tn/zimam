# Managed by Zimam. Changes here are overwritten.
bind 127.0.0.1 -::1
protected-mode yes
port 6379
daemonize no
supervised systemd
pidfile /run/valkey/valkey-server.pid
loglevel notice
logfile /var/log/valkey/valkey-server.log
dir /var/lib/valkey
aclfile /etc/zimam/valkey/users.acl
maxmemory 204mb
maxmemory-policy noeviction

# Persistence is the package's: an RDB snapshot at its built-in schedule (no
# save line, so the default applies) and no append-only file.
dbfilename dump.rdb
appendonly no

# The package's own tunings, which a standalone file would otherwise lose.
hide-user-data-from-log yes
disable-thp yes
jemalloc-bg-thread yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes
replica-lazy-flush yes
set-proc-title yes
proc-title-template "{title} {listen-addr} {server-mode}"
locale-collate ""
rdb-version-check strict
repl-diskless-sync yes
acllog-max-len 128
oom-score-adj no
