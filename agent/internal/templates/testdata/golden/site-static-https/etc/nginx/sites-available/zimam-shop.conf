# Managed by Zimam. Changes here are overwritten.
server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com;
    access_log /var/log/zimam/sites/shop/access.log;
    error_log  /var/log/zimam/sites/shop/error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/zimam-acme;
        default_type text/plain;
        allow all;
        auth_basic off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shop.example.com;
    access_log /var/log/zimam/sites/shop/access.log;
    error_log  /var/log/zimam/sites/shop/error.log;

    ssl_certificate     /etc/letsencrypt/live/zimam-shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zimam-shop/privkey.pem;
    include /etc/nginx/zimam/tls.conf;

    include /etc/nginx/zimam/shop/security.conf;

    root /home/s_shop/site/current/public;
    disable_symlinks if_not_owner from=$document_root;
    index index.html;
    autoindex off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/zimam-acme;
        default_type text/plain;
        allow all;
        auth_basic off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
