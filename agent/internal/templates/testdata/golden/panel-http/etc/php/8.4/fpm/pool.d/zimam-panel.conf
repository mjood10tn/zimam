; Managed by Zimam. Changes here are overwritten.
[zimam-panel]
user = zimam
group = zimam
listen = /run/php/zimam-panel.sock
listen.owner = zimam
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /home/zimam/panel/shared/storage/logs/php-error.log
php_admin_value[sys_temp_dir] = /home/zimam/panel/shared/storage/tmp
php_admin_value[upload_tmp_dir] = /home/zimam/panel/shared/storage/tmp
php_admin_value[session.save_path] = /home/zimam/panel/shared/storage/tmp
