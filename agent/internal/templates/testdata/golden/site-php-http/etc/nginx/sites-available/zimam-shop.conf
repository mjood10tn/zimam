# Managed by Zimam. Changes here are overwritten.
server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com;
    access_log /var/log/zimam/sites/shop/access.log;
    error_log  /var/log/zimam/sites/shop/error.log;

    include /etc/nginx/zimam/shop/security.conf;

    root /home/s_shop/site/current/public;
    index index.php index.html;
    autoindex off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/zimam-acme;
        default_type text/plain;
        allow all;
        auth_basic off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/zimam-shop-8.4.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }
}
