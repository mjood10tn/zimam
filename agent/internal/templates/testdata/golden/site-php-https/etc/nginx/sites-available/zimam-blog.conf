# Managed by Zimam. Changes here are overwritten.
server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;
    access_log /var/log/zimam/sites/blog/access.log;
    error_log  /var/log/zimam/sites/blog/error.log;

    include /etc/nginx/zimam/blog/security.conf;

    root /home/s_blog/site/current/public;
    disable_symlinks if_not_owner;
    index index.php index.html;
    autoindex off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/zimam-acme;
        default_type text/plain;
        allow all;
        auth_basic off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/zimam-blog-8.5.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name blog.example.com;
    access_log /var/log/zimam/sites/blog/access.log;
    error_log  /var/log/zimam/sites/blog/error.log;

    ssl_certificate     /etc/letsencrypt/live/zimam-blog/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zimam-blog/privkey.pem;
    include /etc/nginx/zimam/tls.conf;

