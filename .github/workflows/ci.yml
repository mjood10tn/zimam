name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt -l lists files that need formatting:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go vet and go test, e2e build
        # The e2e tag adds the test-only commands and limits (D22), which
        # end-to-end runs use; their own tests run here.
        run: |
          go vet -tags e2e ./...
          go test -tags e2e ./...
      - name: short fuzz
        # -fuzzminimizetime=0 skips minimizing new inputs, which otherwise takes
        # most of a 10s run's budget. A failing input is then saved unminimized.
        run: bash scripts/fuzz-short.sh 10s -fuzzminimizetime=0
  configcheck:
    # Tests every golden file with the tools that read it (design §14.1).
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build the check image
        uses: docker/build-push-action@v7
        with:
          context: agent/scripts/configcheck
          tags: zimam-configcheck
          load: true
          cache-from: type=gha,scope=configcheck
          cache-to: type=gha,mode=max,scope=configcheck
      - name: check every golden case
        run: bash scripts/configcheck/run.sh zimam-configcheck internal/templates/testdata/golden
  contract:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: schemas match the Go types
        # git diff can't see new files, so untracked ones fail the job too.
        run: |
          go generate ./...
          git diff --exit-code -- ../contract/
          untracked="$(git ls-files --others --exclude-standard -- ../contract/)"
          if [ -n "$untracked" ]; then
            echo "go generate wrote files that aren't committed:"
            echo "$untracked"
            exit 1
          fi
  installer:
    # install.sh (design §4) on the Ubuntu it targets: ShellCheck, then the
    # bats tests (D11), both from Ubuntu 26.04's own packages.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck, then bats, in ubuntu:26.04
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w ubuntu:26.04 bash -c '
            set -eu
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bats openssl python3 systemd shellcheck >/dev/null
            shellcheck --version
            shellcheck installer/install.sh installer/tests/*.bash installer/tests/*.bats
            bats installer/tests'
  panel-php:
    # The panel's tests on the lowest PHP it supports (config.platform.php,
    # D7) and the newest one, plus its asset build.
    name: panel (PHP ${{ matrix.php }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, pdo_sqlite, sqlite3, zip
          coverage: none
      - name: composer install
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: php artisan test
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - name: npm ci && npm run build
        run: npm ci && npm run build
  panel:
    # One check name for branch protection over the PHP matrix. A job
    # skipped because the matrix failed would count as passed there, so
    # this one always runs and fails unless every PHP version passed.
    if: always()
    needs: panel-php
    runs-on: ubuntu-26.04
    steps:
      - name: every PHP version passed
        run: test "${{ needs.panel-php.result }}" = success
