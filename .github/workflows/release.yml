name: release

# A vX.Y.Z tag releases everything together (design §3), in three jobs.
# - panel builds the panel tarball. It runs Composer, npm and the code they
#   install, so it gets no secret.
# - build holds the signing key. Every secret a job uses sits in its runner's
#   memory, so this job runs only Go, git and GitHub's own actions pinned by
#   commit, and restores no cache. It builds the agents and install.sh
#   itself, takes nothing from panel but the tarball (hashed, never
#   unpacked), signs, and runs every gate.
# - publish, the one job with write access, creates the GitHub release once
#   every gate has passed.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  panel:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: intl, mbstring, pdo_sqlite, sqlite3, zip
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: build the panel
        env:
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/build-panel.sh "${TAG#v}" panel-dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panel
          path: panel-dist/
          if-no-files-found: error

  build:
    needs: panel
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check the tag and the release key
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $TAG isn't v<major>.<minor>.<patch>[-<pre-release>]"
            exit 1
          fi
          if [ ! -s release/release-key.pub ]; then
            echo "::error::release/release-key.pub isn't committed"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          # A release never ships a root binary built with an older Go patch
          # than the newest 1.27.x; setup-go otherwise prefers the runner's.
          check-latest: true
          # The panel job could have written a cache under any key.
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: panel
          path: panel-dist
      - name: build and sign
        env:
          TAG: ${{ github.ref_name }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          key="$(mktemp "$RUNNER_TEMP/signing-key.XXXXXX")"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" >"$key"
          unset RELEASE_SIGNING_KEY
          bash .github/scripts/build-release.sh "${TAG#v}" "https://github.com/$GITHUB_REPOSITORY/releases" "$key" \
            "panel-dist/zimam-panel-${TAG#v}.tar.gz"
      - name: gates
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version dist/manifest.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG isn't v$version from manifest.json"
            exit 1
          fi
          # No e2e build, and each agent carries the committed release key.
          # verify then proves that the secret signed for that same key.
          go -C agent run ./tools/release check-binary -key ../release/release-key.pub \
            ../dist/zimam-agent-linux-amd64 ../dist/zimam-agent-linux-arm64
          go -C agent run ./tools/release verify -key ../release/release-key.pub -agent-version "$version" ../dist
          # D7: panel_php_min is Composer's config.platform.php.
          platform="$(jq -r .config.platform.php panel/composer.json)"
          panel_php_min="$(jq -r .panel_php_min dist/manifest.json)"
          if [ "$platform" != "$panel_php_min" ]; then
            echo "::error::config.platform.php is $platform but panel_php_min is $panel_php_min"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ $TAG == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --generate-notes "${prerelease[@]}" dist/*
