name: e2e

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  e2e:
    # The end-to-end run (design §14.2) and the milestone gates: an e2e
    # release, signed with a throwaway key, installed by install.sh in a
    # fresh Ubuntu 26.04 LXD container, with Pebble as the ACME server.
    # Then the upgrade from the previous release, in its own container.
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tags and history, for build-previous.sh's git describe.
          fetch-depth: 0
      - name: shellcheck the harness, in ubuntu:26.04
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w ubuntu:26.04 bash -c '
            set -eu
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq shellcheck >/dev/null
            shellcheck e2e/scripts/*.sh e2e/scenarios/*.sh e2e/probes/*.sh e2e/vps/*.sh e2e/vps/lxc-ssh'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          # The panel's minimum (config.platform.php, D7), as release.yml uses.
          php-version: '8.3'
          extensions: intl, mbstring, pdo_sqlite, sqlite3, zip
          tools: composer
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            panel/package-lock.json
            e2e/browser/package-lock.json
      - name: work directory
        run: echo "E2E_WORK=$RUNNER_TEMP/zimam-e2e" >>"$GITHUB_ENV"
      - name: LXD and the container, Pebble and challtestsrv
        run: bash e2e/scripts/up.sh
      - name: build the e2e release, the contract copy and the probe tools
        run: bash e2e/scripts/build.sh
      - name: serve the release
        run: bash e2e/scripts/serve-release.sh
      - name: install with curl | bash
        run: bash e2e/scripts/install.sh
      - name: done-when 1, the setup link
        run: bash e2e/scenarios/m1-install.sh
      - name: done-when 2 and recovery, in the browser
        run: bash e2e/scripts/browser.sh --project recovery
      - name: the contract suite against the real agent
        run: bash e2e/scenarios/m1-contract.sh
      - name: the root-only Go tests
        run: bash e2e/scenarios/m1-roottests.sh
      - name: done-when 3 to 7, PHP versions, sites, certificates and the switch, in the browser
        run: bash e2e/scripts/browser.sh --project m2-default
      - name: done-when 8 to 10, monitoring, php84's security and the log settings, in the browser
        run: bash e2e/scripts/browser.sh --project m3-settings
      - name: done-when 12, every root-escalation probe in one pass between two identical snapshots
        run: bash e2e/probes/run-all.sh
      - name: done-when 11, the audit re-check (every command, the redaction, the cli:root runs, certbot renew)
        run: bash e2e/scenarios/audit.sh
      - name: running the installer again repairs, after the version check
        run: bash e2e/scenarios/m1-repair.sh
      # The upgrade (e2e/README.md): a fresh container gets the previous
      # release, built by its own build.sh, then this tree's, signed with
      # the same key and built as a later version. Its work directory and
      # container replace the main run's for the steps after, collect-logs
      # and tear down included.
      - name: free the main run's container for the upgrade
        run: bash e2e/scripts/down.sh
      - name: the upgrade's work directory and container
        run: |
          echo "E2E_WORK=$RUNNER_TEMP/zimam-upgrade" >>"$GITHUB_ENV"
          echo "E2E_CONTAINER=zimam-upgrade" >>"$GITHUB_ENV"
      - name: the upgrade, a fresh container, Pebble and challtestsrv
        run: bash e2e/scripts/up.sh
      - name: the upgrade, the previous release, built by its own build.sh
        run: bash e2e/scripts/build-previous.sh
      - name: the upgrade, this tree as the next release, signed with the previous release's key
        run: |
          export E2E_VERSION E2E_RELEASE_KEY
          E2E_VERSION=$(cat "$E2E_WORK/release-previous/next-version")
          E2E_RELEASE_KEY=$E2E_WORK/release-previous/keys/release-key
          bash e2e/scripts/build.sh
      - name: the upgrade from the previous release by running the installer again, and a refused downgrade
        run: bash e2e/scenarios/upgrade.sh
      - name: collect logs
        if: failure()
        run: bash e2e/scripts/collect-logs.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-logs
          path: |
            ${{ runner.temp }}/zimam-e2e/logs
            ${{ runner.temp }}/zimam-upgrade/logs
      - name: tear down
        if: always()
        run: bash e2e/scripts/down.sh
