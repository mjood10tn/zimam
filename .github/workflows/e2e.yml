name: e2e

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  e2e:
    # The end-to-end run (design §14.2) and milestone 1's gate: an e2e
    # release, signed with a throwaway key, installed by install.sh in a
    # fresh Ubuntu 26.04 LXD container, with Pebble as the ACME server.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck the harness, in ubuntu:26.04
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w ubuntu:26.04 bash -c '
            set -eu
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq shellcheck >/dev/null
            shellcheck e2e/scripts/*.sh e2e/scenarios/*.sh e2e/probes/*.sh'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          # The panel's minimum (config.platform.php, D7), as release.yml uses.
          php-version: '8.3'
          extensions: intl, mbstring, pdo_sqlite, sqlite3, zip
          tools: composer
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            panel/package-lock.json
            e2e/browser/package-lock.json
      - name: work directory
        run: echo "E2E_WORK=$RUNNER_TEMP/zimam-e2e" >>"$GITHUB_ENV"
      - name: LXD and the container, Pebble and challtestsrv
        run: bash e2e/scripts/up.sh
      - name: build the e2e release, the contract copy and the probe tools
        run: bash e2e/scripts/build.sh
      - name: serve the release
        run: bash e2e/scripts/serve-release.sh
      - name: install with curl | bash
        run: bash e2e/scripts/install.sh
      - name: done-when 1, the setup link
        run: bash e2e/scenarios/m1-install.sh
      - name: done-when 2 and recovery, in the browser
        run: bash e2e/scripts/browser.sh
      - name: the contract suite against the real agent
        run: bash e2e/scenarios/m1-contract.sh
      - name: the root-only Go tests
        run: bash e2e/scenarios/m1-roottests.sh
      - name: the caller and protocol probes, and the files they must not change
        run: bash e2e/probes/run.sh
      - name: done-when 11, the audit log
        run: bash e2e/scenarios/m1-audit.sh
      - name: collect logs
        if: failure()
        run: bash e2e/scripts/collect-logs.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/zimam-e2e/logs
      - name: tear down
        if: always()
        run: bash e2e/scripts/down.sh
