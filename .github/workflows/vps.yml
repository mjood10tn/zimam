name: vps

# The real-server run (design §14.3): every e2e scenario and probe against a
# fresh Hetzner Cloud server per architecture (D2), installed from an e2e
# release against Let's Encrypt staging with UFW on, its names from
# sslip.io. release.yml calls it before publishing; it can also be started
# by hand. See e2e/vps/README.md. HCLOUD_TOKEN reaches only the create and
# delete jobs, which check the repository out fresh, set nothing up and run
# no package code. The vps job between them builds and tests with Composer
# and npm code and gets only this run's server: its address and SSH key.
on:
  workflow_call:
    secrets:
      HCLOUD_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      keep_server:
        description: Leave the servers for the sweep instead of deleting them (to test vps-sweep.yml)
        type: boolean
        default: false

permissions:
  contents: read

env:
  # SHA-256 of https://letsencrypt.org/certs/staging/letsencrypt-stg-root-x1.pem
  # and -x2.pem, checked on 2026-11-08; the test clients trust only these.
  STAGING_ROOT_SHA256: |
    3a5e1171e5f5c2d41522d438f225602e4236a68fb29c32399a95921a4ae80e73
    497c36c1b50c0daff30870d5908c9b97af29223d5510c5e6c24957d0cc502fb8

jobs:
  create:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      E2E_GOARCH: ${{ matrix.arch }}
      E2E_VPS_TAG: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: work directory
        run: echo "E2E_WORK=$RUNNER_TEMP/zimam-e2e" >>"$GITHUB_ENV"
      - name: create the server, wait for SSH and sslip.io
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: bash e2e/vps/create.sh
      # The server's address and the throwaway key that opens it, for the vps
      # job. The key opens only this run's server, for a day at most.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vps-access-${{ matrix.arch }}
          path: ${{ runner.temp }}/zimam-e2e/access/
          retention-days: 1
          if-no-files-found: error

  # The upgrade's own fresh server, amd64 only to bound the cost. A job of
  # its own, so a server that fails to come up here never skips the vps job.
  create-upgrade:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      E2E_GOARCH: amd64
      E2E_VPS_TAG: ${{ github.run_id }}-${{ github.run_attempt }}-upgrade-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: work directory
        run: echo "E2E_WORK=$RUNNER_TEMP/zimam-e2e" >>"$GITHUB_ENV"
      - name: create the server, wait for SSH and sslip.io
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: bash e2e/vps/create.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vps-access-upgrade-amd64
          path: ${{ runner.temp }}/zimam-e2e/access/
          retention-days: 1
          if-no-files-found: error

  vps:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      E2E_GOARCH: ${{ matrix.arch }}
      E2E_VPS_TAG: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: work directory
        run: echo "E2E_WORK=$RUNNER_TEMP/zimam-e2e" >>"$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vps-access-${{ matrix.arch }}
          path: ${{ runner.temp }}/zimam-e2e/access
      - name: reach the server create made
        run: bash e2e/vps/attach.sh >>"$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: intl, mbstring, pdo_sqlite, sqlite3, zip
          tools: composer
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            panel/package-lock.json
            e2e/browser/package-lock.json
      - name: build the e2e release, the contract copy and the probe tools
        run: bash e2e/scripts/build.sh
      - name: serve the release on the server
        run: bash e2e/scripts/serve-release.sh
      - name: install with curl | bash, Let's Encrypt staging, UFW on
        run: bash e2e/scripts/install.sh
      - name: done-when 1, the setup link
        run: bash e2e/scenarios/m1-install.sh
      - name: done-when 2 and recovery, in the browser
        run: bash e2e/scripts/browser.sh --project recovery
      - name: the contract suite against the real agent
        run: bash e2e/scenarios/m1-contract.sh
      - name: the root-only Go tests
        run: bash e2e/scenarios/m1-roottests.sh
      - name: done-when 3 to 7, PHP versions, sites, certificates and the switch, in the browser
        run: bash e2e/scripts/browser.sh --project m2-default
      - name: done-when 8 to 10, monitoring, php84's security and the log settings, in the browser
        run: bash e2e/scripts/browser.sh --project m3-settings
      - name: the Git host that plays GitHub for deploys, in Docker on this runner, tunnelled to the server
        run: bash e2e/githost/githost.sh up
      - name: v0.2.0 done-when 1 to 8, a Laravel site deployed, rolled back and webhook-deployed, in the browser
        run: bash e2e/scripts/browser.sh --project v02-deploy
      - name: v0.3.0, MySQL and Valkey from the panel, two sites with their own users, a rotation, and a site deleted with its databases, in the browser
        run: bash e2e/scripts/browser.sh --project v03-databases
      - name: v0.4.0, Node.js installed, changed and removed, a deploy that builds with npm, queue workers, the scheduler and a cron job, restarts on deploy and PHP switch, and a site deleted with them
        run: bash e2e/scenarios/v04-workers.sh
      - name: v0.4.0, a worker, a cron job, the scheduler and the Node.js page, in the browser
        run: bash e2e/scripts/browser.sh --project v04-workers
      # v0.5.0's backups need the sinks (e2e/sinks), which run only in LXD:
      # v05-backups.sh, the v05-backups spec and probes/backups.sh skip here
      # with that reason, and audit.sh asks for no backup command.
      - name: v0.5.0, backups (skipped on a VPS, which has no sinks)
        run: bash e2e/scenarios/v05-backups.sh
      - name: v0.6.0, server security, guarded firewall and SSH changes included (UFW is active here)
        run: bash e2e/scenarios/v06-security.sh
      - name: done-when 12, every root-escalation probe in one pass between two identical snapshots
        run: bash e2e/probes/run-all.sh
      - name: done-when 11, the audit re-check
        run: bash e2e/scenarios/audit.sh
      - name: IPv4 over real DNS, and IPv6 on the server
        run: bash e2e/vps/ipv6.sh
      - name: running the installer again repairs, after the version check
        run: bash e2e/scenarios/m1-repair.sh
      - name: collect logs
        if: failure()
        run: bash e2e/scripts/collect-logs.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: vps-logs-${{ matrix.arch }}
          path: ${{ runner.temp }}/zimam-e2e/logs

  # The upgrade (e2e/README.md) on its own fresh amd64 server: the previous
  # release, built by its own build.sh, then this tree's, signed with the
  # same key and built as a later version, through the installer again.
  upgrade:
    needs: create-upgrade
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      E2E_GOARCH: amd64
      E2E_VPS_TAG: ${{ github.run_id }}-${{ github.run_attempt }}-upgrade-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tags and history, for build-previous.sh's git describe.
          fetch-depth: 0
      - name: work directory
        run: echo "E2E_WORK=$RUNNER_TEMP/zimam-e2e" >>"$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vps-access-upgrade-amd64
          path: ${{ runner.temp }}/zimam-e2e/access
      - name: reach the server create made
        run: bash e2e/vps/attach.sh >>"$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: intl, mbstring, pdo_sqlite, sqlite3, zip
          tools: composer
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            panel/package-lock.json
            e2e/browser/package-lock.json
      - name: the previous release, built by its own build.sh
        run: bash e2e/scripts/build-previous.sh
      - name: this tree as the next release, signed with the previous release's key
        run: |
          export E2E_VERSION E2E_RELEASE_KEY
          E2E_VERSION=$(cat "$E2E_WORK/release-previous/next-version")
          E2E_RELEASE_KEY=$E2E_WORK/release-previous/keys/release-key
          bash e2e/scripts/build.sh
      - name: the upgrade from the previous release by running the installer again, and a refused downgrade
        run: bash e2e/scenarios/upgrade.sh
      - name: collect logs
        if: failure()
        run: bash e2e/scripts/collect-logs.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: vps-logs-upgrade-amd64
          path: ${{ runner.temp }}/zimam-e2e/logs

  # Runs whatever the create jobs, vps and upgrade did, failed or cancelled
  # included, so a half-created server goes too; keep_server leaves them
  # for vps-sweep.yml.
  delete:
    needs: [create, create-upgrade, vps, upgrade]
    if: always() && !inputs.keep_server
    strategy:
      fail-fast: false
      matrix:
        run: [amd64, arm64, upgrade-amd64]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      E2E_VPS_TAG: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: delete the server
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: bash e2e/vps/destroy.sh
